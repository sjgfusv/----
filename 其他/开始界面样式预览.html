<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深渊回廊 · 开始界面预览</title>
  <style>
    /* ============================================================
       开始界面 — 保留原有背景 + 粒子特效
       文字和按钮为新风格
       ============================================================ */

    /* ===== 全局变量 ===== */
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;

      --bg-primary: #070b18;
      --bg-secondary: #0d1428;

      --text-primary: #f0f4ff;
      --text-secondary: #a8bce0;
      --text-muted: #6a7fa0;

      --accent-cyan: #5fd0e0;
      --accent-purple: #9a8ef0;
      --accent-gold: #f0d06a;

      --border-subtle: rgba(255, 255, 255, 0.06);
      --shadow-soft: 0 8px 28px rgba(0, 0, 0, 0.5);
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      /* ===== 保留原有背景 ===== */
      background: radial-gradient(ellipse at 50% 40%, #1a2341 0%, #090b14 70%);
      color: var(--text-primary);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* ============================================================
       粒子层（向上飘动 — 原版效果）
       ============================================================ */
    .start-particles {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(115, 240, 180, 0.3);
      border-radius: 50%;
      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      0% {
        transform: translateY(100vh) scale(0);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      90% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1);
        opacity: 0;
      }
    }

    /* ============================================================
       开始界面主容器
       ============================================================ */
    .start-screen {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 20px;
      width: 100%;
      max-width: 800px;
    }

    /* ===== 标题区域 ===== */
    .start-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .start-welcome {
      font-size: 1.1rem;
      color: var(--text-secondary);
      letter-spacing: 0.3em;
      font-weight: 300;
      animation: fadeInDown 1s ease 0.2s both;
    }

    .start-title {
      font-size: 4.5rem;
      font-weight: 900;
      /* ===== 青色→紫色渐变（与经典界面一致） ===== */
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-cyan));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmerTitle 4s ease-in-out infinite, fadeInDown 1s ease 0.4s both;
      letter-spacing: 0.06em;
      line-height: 1.6;
      text-shadow: none;
    }

    @keyframes shimmerTitle {
      0%,
      100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    .start-subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
      letter-spacing: 0.4em;
      margin-top: 4px;
      margin-bottom: 36px;
      animation: fadeInDown 1s ease 0.6s both;
      opacity: 0.6;
    }

    /* ===== 开始按钮 — 玻璃态风格（与经典界面一致） ===== */
    .start-button {
      padding: 16px 56px;
      border-radius: 999px;
      font-size: 1.15rem;
      font-weight: 700;
      background: rgba(95, 208, 224, 0.08);
      color: var(--accent-cyan);
      border: 1.5px solid rgba(95, 208, 224, 0.25);
      cursor: pointer;
      transition: all 0.3s ease;
      animation: fadeInUp 1s ease 0.8s both;
      letter-spacing: 0.04em;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: 0 0 30px rgba(95, 208, 224, 0.05);
    }

    .start-button:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(95, 208, 224, 0.16);
      border-color: rgba(95, 208, 224, 0.5);
      box-shadow: 0 0 50px rgba(95, 208, 224, 0.15);
    }

    .start-button:active {
      transform: scale(0.96);
    }

    .start-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent 40%, rgba(95, 208, 224, 0.08) 50%, transparent 60%);
      background-size: 200% 100%;
      animation: btnShine 4s ease-in-out infinite;
    }

    @keyframes btnShine {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    /* ===== 版本号 ===== */
    .start-version {
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.7rem;
      margin-top: 24px;
      letter-spacing: 0.1em;
      animation: fadeInUp 1s ease 1s both;
    }

    /* ===== 更新日志按钮（右上角） ===== */
    .start-changelog-btn {
      position: fixed;
      top: 20px;
      right: 24px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.25s ease;
      z-index: 10;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .start-changelog-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    .start-changelog-btn:active {
      transform: scale(0.95);
    }

    /* ============================================================
       入场动画
       ============================================================ */
    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ============================================================
       响应式
       ============================================================ */
    @media (max-width: 600px) {
      .start-title {
        font-size: 2.8rem;
      }

      .start-welcome {
        font-size: 0.9rem;
      }

      .start-subtitle {
        font-size: 0.8rem;
        margin-bottom: 28px;
      }

      .start-button {
        padding: 14px 40px;
        font-size: 1rem;
      }

      .start-version {
        font-size: 0.6rem;
      }

      .start-changelog-btn {
        top: 14px;
        right: 16px;
        font-size: 0.7rem;
        padding: 6px 14px;
      }
    }

    @media (max-width: 400px) {
      .start-title {
        font-size: 2.2rem;
      }

      .start-welcome {
        font-size: 0.75rem;
      }

      .start-subtitle {
        font-size: 0.65rem;
        margin-bottom: 20px;
      }

      .start-button {
        padding: 12px 32px;
        font-size: 0.85rem;
      }

      .start-changelog-btn {
        font-size: 0.6rem;
        padding: 4px 10px;
        top: 10px;
        right: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- ============================================================
  粒子层（向上飘动）
  ============================================================ -->
  <div class="start-particles" id="startParticles"></div>

  <!-- ============================================================
  开始界面内容
  ============================================================ -->
  <div class="start-screen">

    <!-- 更新日志按钮 -->
    <button class="start-changelog-btn">更新日志</button>

    <!-- 主内容 -->
    <div class="start-content">
      <div class="start-logo">
        <span class="start-welcome">欢迎游玩</span>
        <span class="start-title">深 渊 回 廊</span>
      </div>
      <div class="start-subtitle">— 咕咕嘎嘎 —</div>
      <button class="start-button">开始游戏</button>
      <div class="start-version">v2.2 by heshen</div>
    </div>
  </div>

  <!-- ============================================================
  JS — 生成粒子
  ============================================================ -->
  <script>
    (function() {
      const container = document.getElementById('startParticles');
      if (!container) return;

      const particleCount = 60;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = 2 + Math.random() * 4;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDuration = 8 + Math.random() * 12 + 's';
        particle.style.animationDelay = Math.random() * 10 + 's';
        particle.style.opacity = 0.2 + Math.random() * 0.4;
        container.appendChild(particle);
      }
    })();
  </script>

</body>
</html>
