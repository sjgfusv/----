<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深渊回廊 · Logo 透明大字版</title>
<style>
  :root {
    --bg: #070b18;
    --panel: rgba(18, 24, 40, 0.92);
    --text: #f3f6ff;
    --muted: #90a2c8;
    --cyan: #5fd0e0;
    --purple: #9a8ef0;
    --gold: #f7b731;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(ellipse at 50% 0%, #1a2341 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  h1 {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--cyan), var(--purple), var(--cyan));
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.12em;
    animation: shimmer 4s ease-in-out infinite;
    margin-bottom: 6px;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .sub { color: var(--muted); letter-spacing: 0.4em; font-size: 0.85rem; margin-bottom: 30px; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 28px 28px 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; align-items: center;
    max-width: 560px; width: 100%;
  }
  .stage {
    width: 420px; height: 420px;
    border-radius: 12px;
    background-color: #10131c;
    background-image:
      linear-gradient(45deg, #1a1e2a 25%, transparent 25%, transparent 75%, #1a1e2a 75%),
      linear-gradient(45deg, #1a1e2a 25%, transparent 25%, transparent 75%, #1a1e2a 75%);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
    margin-bottom: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .stage img { width: 100%; height: 100%; display: block; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 24px;
    border-radius: 999px;
    font-size: 0.92rem; font-weight: 700;
    cursor: pointer; text-decoration: none;
    border: 1.5px solid rgba(95,208,224,0.35);
    background: rgba(95,208,224,0.08);
    color: var(--cyan);
    transition: all .2s;
    user-select: none;
  }
  .btn:hover { background: rgba(95,208,224,0.18); border-color: rgba(95,208,224,0.6); box-shadow: 0 0 24px rgba(95,208,224,0.2); }
  .btn.gold { border-color: rgba(247,183,49,0.35); background: rgba(247,183,49,0.08); color: var(--gold); }
  .btn.gold:hover { background: rgba(247,183,49,0.16); border-color: rgba(247,183,49,0.6); box-shadow: 0 0 24px rgba(247,183,49,0.18); }
  .tip { margin-top: 26px; color: var(--muted); font-size: 0.85rem; text-align: center; line-height: 1.9; max-width: 680px; }
  .tip b { color: var(--gold); }
</style>
</head>
<body>
  <h1>深渊回廊</h1>
  <div class="sub">— LOGO 透明大字版 · 无背景 —</div>

  <div class="card">
    <div class="stage"><img src="logo-clear.png" alt="深渊回廊透明Logo"></div>
    <div class="actions">
      <a class="btn gold" href="logo-clear.png" download="深渊回廊-logo-512.png">⬇ 下载 PNG · 512×512 透明</a>
    </div>
  </div>

  <div class="tip">
    背景已去除（棋盘格区域即透明部分），可直接叠在任何页面上使用。<br>
    如需微调：<b>字号大小</b>、<b>字间距</b>、<b>渐变方向/颜色</b>，或去掉辉光后仍觉得不够锐利可换字体。
  </div>
</body>
</html>
