<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>深渊回廊 - 测试面板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #0b0e1a;
      color: #d0d8e8;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    h1 {
      color: #73f0b4;
      font-size: 2rem;
      border-bottom: 1px solid rgba(115,240,180,0.2);
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-bar {
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .status-bar .env { font-size: 0.9rem; }
    .status-bar .env.ok { color: #73f0b4; }
    .status-bar .env.err { color: #ff5d7a; }
    .status-bar .game-status { font-size: 0.85rem; color: #b0c8d8; }
    .test-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .test-btn {
      background: rgba(115,240,180,0.12);
      border: 1px solid rgba(115,240,180,0.2);
      color: #d0d8e8;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .test-btn:hover {
      background: rgba(115,240,180,0.25);
      border-color: #73f0b4;
      transform: translateY(-2px);
    }
    .test-btn:disabled { opacity: 0.4; pointer-events: none; }
    .test-btn.running {
      background: rgba(255,207,107,0.2);
      border-color: #ffcf6b;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    #logOutput {
      background: rgba(0,0,0,0.4);
      border-radius: 12px;
      padding: 16px;
      max-height: 600px;
      overflow-y: auto;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 0.85rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid rgba(255,255,255,0.06);
    }
    #logOutput::-webkit-scrollbar { width: 4px; }
    #logOutput::-webkit-scrollbar-thumb { background: rgba(115,240,180,0.3); border-radius: 4px; }
    .log-line { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .log-line.pass { color: #73f0b4; }
    .log-line.fail { color: #ff5d7a; }
    .log-line.info { color: #b0c8d8; }
    .log-line.warn { color: #ffcf6b; }
    .log-line.error { color: #ff5d7a; font-weight: bold; }
    .summary {
      margin-top: 16px;
      padding: 14px 18px;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      font-size: 1.05rem;
      font-weight: bold;
    }
    .summary.pass { color: #73f0b4; border-left: 4px solid #73f0b4; }
    .summary.fail { color: #ff5d7a; border-left: 4px solid #ff5d7a; }
    .summary.running { color: #ffcf6b; border-left: 4px solid #ffcf6b; }
    .connect-btn {
      background: rgba(255,207,107,0.15);
      border: 1px solid #ffcf6b;
      color: #ffcf6b;
      padding: 6px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.25s;
    }
    .connect-btn:hover {
      background: rgba(255,207,107,0.25);
    }
    #testResult {
      display:none; margin-top:16px; padding:12px 14px;
      border-radius:10px; font:12px/1.7 Consolas,'Courier New',monospace;
      white-space:pre-wrap; max-height:65vh; overflow:auto;
    }
    #testResult.ok  { border:2px solid #2ecc71; background:#eafaf1; color:#145a32; }
    #testResult.bad { border:2px solid #e74c3c;  background:#fdedec; color:#78281f; }
    #testResult h4  { margin:0 0 8px; font-size:14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>深渊回廊测试面板</h1>

    <div class="status-bar">
      <span class="env" id="envStatus">⏳ 检查环境...</span>
      <span class="game-status" id="gameStatus">
        <button class="connect-btn" id="connectBtn">连接游戏</button>
      </span>
    </div>

    <div class="test-grid" id="testButtons">
      <!-- 按钮由 JS 动态生成 -->
    </div>

    <div id="logContainer">
      <div id="logOutput">等待测试...</div>
      <div id="summary" class="summary" style="display:none;"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // 测试面板核心（使用 postMessage 通信）
    // ============================================================

    // ----- 配置：测试列表（支持扩展） -----
    const testSuites = [
      {
        id: 'curse',
        name: '诅咒测试',
        file: '诅咒测试.js',
        description: '运行 TRIAL_CURSES 中所有诅咒的测试'
      },
      {
        id: 'classic',
        name: '经典界面测试',
        file: '经典测试.js',
        description: '全面测试英雄选择、战斗、商店、事件、休整、精英、Boss、结局'
      },
      {
        id: 'trial',
        name: '试炼界面测试',
        file: '试炼测试.js',
        description: '全面测试试炼模式：进入、战斗、诅咒、商店、退出'
      },
      {
        id: 'bonus',
        name: '增益测试',
        file: '增益测试.js',
        description: '全面测试所有开局增益的生效、战斗效果、存档读档和试炼复制'
      },
      {
        id: 'relic',
        name: '遗物测试',
        file: '遗物测试.js',
        description: '全面测试遗物系统：获取、效果、叠加、试炼模式'
      },
      {
        id: 'shop',
        name: '商品测试',
        file: '商品测试.js',
        description: '全面测试经典商店和试炼商店的购买、限购、价格等'
      },
      {
        id: 'event',
        name: '随机事件测试',
        file: '随机事件测试.js',
        description: '全面测试经典事件和试炼事件的触发、选项、效果'
      },
      {
        id: 'customDifficulty',
        name: '自定义难度测试',
        file: '自定义难度测试.js',
        description: '测试自定义难度参数及死亡路径'
      },
      {
        id: 'trialShopSync',
        name: '试炼商店同步测试',
        file: '试炼商店同步测试.js',
        description: '验证购买试炼遗物后进入试炼是否生效'
      },
      {
        id: 'saveManager',
        name: '多存档测试',
        file: '多存档测试.js',
        description: '测试存档切换/删除/重命名/迁移'
      },
      {
        id: 'heroDiversity',
        name: '英雄多样性测试',
        file: '英雄多样性测试.js',
        description: '遍历所有英雄验证技能'
      },
      {
        id: 'monster',
        name: '怪物测试',
        file: '怪物测试.js',
        description: '测试所有怪物类型：普通/精英/Boss/咕咕嘎嘎'
      },
      {
        id: 'mobile',
        name: '移动端适配测试',
        file: '移动端适配测试.js',
        description: '模拟窗口尺寸测试UI响应'
      },
      {
        id: 'environment',
        name: '环境效果测试',
        file: '环境测试.js',
        description: '验证环境池/生成器/各类钩子/战斗链路/存档往返'
      },
    ];

    let gameContext = null;
    let isConnected = false;

    const envStatus = document.getElementById('envStatus');
    const gameStatus = document.getElementById('gameStatus');
    const logOutput = document.getElementById('logOutput');
    const summaryDiv = document.getElementById('summary');
    const connectBtn = document.getElementById('connectBtn');

    // ----- 请求游戏上下文 -----
    function requestGameContext() {
      if (!window.opener) {
        envStatus.textContent = '❌ 没有父窗口，请使用 window.open 打开此页面';
        envStatus.className = 'env err';
        return;
      }
      envStatus.textContent = '⏳ 请求游戏上下文...';
      envStatus.className = 'env';
      window.opener.postMessage({ type: 'GET_GAME_CONTEXT' }, '*');
    }

    // ----- 监听来自游戏页面的消息 -----
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (data && data.type === 'GAME_CONTEXT') {
        gameContext = data.payload;
        isConnected = true;
        envStatus.textContent = '✅ 已连接到游戏环境';
        envStatus.className = 'env ok';
        gameStatus.innerHTML = `游戏已连接`;
        addLogLine('✅ 游戏上下文已接收', 'pass');
        document.querySelectorAll('.test-btn').forEach(b => b.disabled = false);
      } else if (data && data.type === 'GAME_CONTEXT_ERROR') {
        envStatus.textContent = '❌ 游戏页面未回复，请确保已执行初始化脚本';
        envStatus.className = 'env err';
        addLogLine('❌ 游戏上下文请求失败: ' + data.message, 'error');
      } else if (data && data.type === 'TEST_RESULT') {
          console.log('📥 测试面板收到结果:', data);
          const result = data.result;
          if (!result) {
            addLogLine('❌ 收到空结果', 'error');
            finishSummary(false);
            // 恢复按钮
            document.querySelectorAll('.test-btn').forEach(b => b.disabled = false);
            document.querySelectorAll('.test-btn.running').forEach(b => b.classList.remove('running'));
            return;
          }
          if (result.error) {
            addLogLine(`❌ 测试执行出错: ${result.error}`, 'error');
            finishSummary(false);
          } else {
            // 确保 logs 是数组
            const logs = Array.isArray(result.logs) ? result.logs : [];
            if (logs.length === 0) {
              addLogLine('⚠️ 测试未返回任何日志', 'warn');
            } else {
              logs.forEach(log => {
                const type = log.startsWith('✅') ? 'pass' : (log.startsWith('❌') ? 'fail' : 'info');
                addLogLine(log, type);
              });
            }
            finishSummary(result.passed);
          }
          // 恢复按钮状态
          document.querySelectorAll('.test-btn').forEach(b => b.disabled = false);
          document.querySelectorAll('.test-btn.running').forEach(b => b.classList.remove('running'));
      }
      // 接收测试结果
      if (d.type === 'testResult') {
        const box = document.getElementById('testResult');
        const good = d.failed === 0;
        box.style.display = 'block';
        box.className = good ? 'ok' : 'bad';
        const lines = Array.isArray(d.log) ? d.log.join('\n') : String(d.log || '');
        box.innerHTML = '';   // 用 textContent 防注入更稳：
        box.textContent =
        `━━━ ${good ? '🎉 全部通过' : '⚠️ 存在失败项'} ━━━
        通过 ${d.passed} | 失败 ${d.failed} | 总计 ${d.passed + d.failed}
        ${lines}`;
      }

    });

    // ----- 点击连接按钮 -----
    connectBtn.addEventListener('click', () => {
      requestGameContext();
    });

    // ----- 渲染测试按钮 -----
    function renderButtons() {
      const container = document.getElementById('testButtons');
      container.innerHTML = '';
      testSuites.forEach(suite => {
        const btn = document.createElement('button');
        btn.className = 'test-btn';
        btn.textContent = suite.name;
        btn.dataset.id = suite.id;
        btn.title = suite.description || '';
        btn.disabled = true;
        btn.addEventListener('click', () => runTest(suite));
        container.appendChild(btn);
      });
    }

    // ----- 运行测试（发送消息给游戏） -----
    async function runTest(suite) {
      if (!gameContext) {
        addLogLine('❌ 未连接到游戏，请先点击“连接游戏”', 'error');
        return;
      }

      document.querySelectorAll('.test-btn').forEach(b => b.disabled = true);
      const btn = document.querySelector(`.test-btn[data-id="${suite.id}"]`);
      if (btn) btn.classList.add('running');

      logOutput.innerHTML = '';
      summaryDiv.style.display = 'none';
      summaryDiv.className = 'summary';

      addLogLine(`▶️ 请求游戏运行测试：${suite.name}`, 'info');

      if (window.opener) {
        window.opener.postMessage({
          type: 'RUN_TEST',
          testFile: suite.file,
          testId: suite.id
        }, '*');
        addLogLine('⏳ 等待测试结果...', 'info');
      } else {
        addLogLine('❌ 无法发送请求，没有游戏窗口', 'error');
        finishSummary(false);
        document.querySelectorAll('.test-btn').forEach(b => b.disabled = false);
        if (btn) btn.classList.remove('running');
      }
    }

    function addLogLine(msg, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line ${type}`;
      line.textContent = msg;
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function finishSummary(passed) {
      summaryDiv.style.display = 'block';
      if (passed === true) {
        summaryDiv.className = 'summary pass';
        summaryDiv.textContent = '🎉 测试通过！';
      } else if (passed === false) {
        summaryDiv.className = 'summary fail';
        summaryDiv.textContent = '❌ 测试失败，请检查日志。';
      } else {
        summaryDiv.className = 'summary running';
        summaryDiv.textContent = '⏳ 测试已完成，但未检测到明确结果，请手动检查日志。';
      }
    }

    // ----- 控制台输出捕获（仅用于测试面板自身的日志） -----
    const originalConsole = { log: console.log, error: console.error, warn: console.warn, info: console.info };
    const typeMap = { 'log': 'info', 'info': 'info', 'warn': 'warn', 'error': 'error' };
    function interceptConsole(method, type) {
      return function(...args) {
        originalConsole[method].apply(console, args);
        let msg = args.map(arg => {
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); } catch (e) { return String(arg); }
          }
          return String(arg);
        }).join(' ');
        if (logOutput) addLogLine(msg, typeMap[type] || 'info');
      };
    }
    console.log = interceptConsole('log', 'log');
    console.info = interceptConsole('info', 'info');
    console.warn = interceptConsole('warn', 'warn');
    console.error = interceptConsole('error', 'error');

    // ----- 初始化 -----
    renderButtons();
    addLogLine('📋 测试面板已加载', 'info');
    addLogLine('👉 请点击“连接游戏”按钮，或在游戏控制台执行初始化脚本。', 'info');
    setTimeout(() => {
      if (!isConnected) requestGameContext();
    }, 500);
  </script>
</body>
</html>
