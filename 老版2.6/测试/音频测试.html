<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深渊回廊 - 音频测试</title>
    <link rel="stylesheet" href="../主样式.css">
    <style>
        .test-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        
        .test-title {
            text-align: center;
            color: var(--accent);
            margin-bottom: 30px;
            font-size: 24px;
        }
        
        .test-section {
            margin-bottom: 25px;
        }
        
        .test-section h3 {
            color: var(--accent);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }
        
        .test-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .test-btn {
            padding: 10px 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .test-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }
        
        .test-btn:active {
            transform: translateY(0);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .control-group label {
            color: var(--text);
            font-size: 14px;
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 25px;
            background: #ccc;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .toggle-switch.active {
            background: var(--accent);
        }
        
        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 21px;
            height: 21px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        
        .toggle-switch.active::after {
            transform: translateX(25px);
        }
        
        .volume-slider {
            width: 100px;
        }
        
        .status {
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            color: #00ff00;
            max-height: 150px;
            overflow-y: auto;
        }
        
        .scene-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .scene-btn {
            padding: 8px 16px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .scene-btn:hover {
            background: var(--accent);
        }
        
        .scene-btn.active {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 class="test-title">🎵 深渊回廊音频测试</h1>
        
        <div class="test-section">
            <h3>🎛️ 音效控制</h3>
            <div class="controls">
                <div class="control-group">
                    <label>背景音乐:</label>
                    <div class="toggle-switch active" id="bgmToggle"></div>
                </div>
                <div class="control-group">
                    <label>音效:</label>
                    <div class="toggle-switch active" id="sfxToggle"></div>
                </div>
                <div class="control-group">
                    <label>主音量:</label>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0.7">
                    <span id="volumeValue">70%</span>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h3>🎵 场景音乐</h3>
            <div class="scene-controls">
                <button class="scene-btn active" data-scene="menu">菜单</button>
                <button class="scene-btn" data-scene="explore">探索</button>
                <button class="scene-btn" data-scene="battle">战斗</button>
                <button class="scene-btn" data-scene="boss">Boss</button>
                <button class="scene-btn" data-scene="elite">精英</button>
                <button class="scene-btn" data-scene="mirror">镜像</button>
                <button class="scene-btn" data-scene="shop">商店</button>
                <button class="scene-btn" data-scene="rest">休整</button>
                <button class="scene-btn" data-scene="ending">结局</button>
            </div>
        </div>
        
        <div class="test-section">
            <h3>🔊 音效测试</h3>
            <div class="test-buttons">
                <button class="test-btn" data-sfx="attack">攻击</button>
                <button class="test-btn" data-sfx="hurt">受伤</button>
                <button class="test-btn" data-sfx="victory">胜利</button>
                <button class="test-btn" data-sfx="defeat">失败</button>
                <button class="test-btn" data-sfx="block">格挡</button>
                <button class="test-btn" data-sfx="coin">金币</button>
                <button class="test-btn" data-sfx="skill">技能</button>
                <button class="test-btn" data-sfx="potion">药水</button>
                <button class="test-btn" data-sfx="dodge">闪避</button>
                <button class="test-btn" data-sfx="crit">暴击</button>
                <button class="test-btn" data-sfx="boss">Boss</button>
                <button class="test-btn" data-sfx="elite">精英登场</button>
                <button class="test-btn" data-sfx="mirror">镜像登场</button>
                <button class="test-btn" data-sfx="shop">商店</button>
                <button class="test-btn" data-sfx="rest">休整</button>
                <button class="test-btn" data-sfx="ending">结局</button>
                <button class="test-btn" data-sfx="floor">楼层</button>
                <button class="test-btn" data-sfx="reward">奖励</button>
                <button class="test-btn" data-sfx="error">错误</button>
                <button class="test-btn" data-sfx="buy">购买</button>
                <button class="test-btn" data-sfx="heal">治疗</button>
                <button class="test-btn" data-sfx="finale">结局</button>
                <button class="test-btn" data-sfx="chest">宝箱</button>
                <button class="test-btn" data-sfx="trap">陷阱</button>
                <button class="test-btn" data-sfx="poison">毒烟</button>
                <button class="test-btn" data-sfx="burn">灼烧</button>
                <button class="test-btn" data-sfx="curse">诅咒</button>
                <button class="test-btn" data-sfx="revive">不死图腾</button>
                <button class="test-btn" data-sfx="combo">连击</button>
                <button class="test-btn" data-sfx="execute">斩杀</button>
                <button class="test-btn" data-sfx="battleStart">战斗开始</button>
                <button class="test-btn" data-sfx="save">存档</button>
                <button class="test-btn" data-sfx="shield">护盾</button>
                <button class="test-btn" data-sfx="lucky">幸运</button>
                <button class="test-btn" data-sfx="thorn">荆棘</button>
                <button class="test-btn" data-sfx="vampire">吸血</button>
                <button class="test-btn" data-sfx="xp">经验献祭</button>
                <button class="test-btn" data-sfx="event">随机事件</button>
                <button class="test-btn" data-sfx="dice">骰子</button>
                <button class="test-btn" data-sfx="anvil">铁砧</button>
                <button class="test-btn" data-sfx="whisper">低语</button>
                <button class="test-btn" data-sfx="wish">许愿</button>
                <button class="test-btn" data-sfx="splash">泉水</button>
                <button class="test-btn" data-sfx="sacrifice">献祭</button>
                <button class="test-btn" data-sfx="buff">增益</button>
                <button class="test-btn" data-sfx="debuff">减益</button>
                <button class="test-btn" data-sfx="goldLose">损失金币</button>
                <button class="test-btn" data-sfx="levelUp">升级</button>
                <button class="test-btn" data-sfx="door">开门</button>
            </div>
        </div>
        
        <div class="test-section">
            <h3>📊 状态信息</h3>
            <div class="status" id="status">
                音效系统已初始化...<br>
                点击任意按钮开始测试！
            </div>
        </div>
    </div>

    <script src="../AbyssAudio.js"></script>
    <script>
        // 状态显示
        const status = document.getElementById('status');
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            status.innerHTML += `[${timestamp}] ${message}<br>`;
            status.scrollTop = status.scrollHeight;
        }
        
        // 初始化
        log('音效系统初始化完成');
        log('Web Audio API 状态: ' + (window.AbyssAudio.audioContext ? '已创建' : '未创建'));
        
        // 音效控制
        const bgmToggle = document.getElementById('bgmToggle');
        const sfxToggle = document.getElementById('sfxToggle');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeValue = document.getElementById('volumeValue');
        
        bgmToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            const enabled = this.classList.contains('active');
            window.AbyssAudio.setBGM(enabled);
            log(`背景音乐 ${enabled ? '开启' : '关闭'}`);
        });
        
        sfxToggle.addEventListener('click', function() {
            this.classList.toggle('active');
            const enabled = this.classList.contains('active');
            window.AbyssAudio.setSFX(enabled);
            log(`音效 ${enabled ? '开启' : '关闭'}`);
        });
        
        volumeSlider.addEventListener('input', function() {
            const volume = parseFloat(this.value);
            window.AbyssAudio.setMasterVolume(volume);
            volumeValue.textContent = Math.round(volume * 100) + '%';
            log(`主音量: ${Math.round(volume * 100)}%`);
        });
        
        // 场景控制（引擎支持的场景: menu/explore/battle/boss/elite/mirror/shop/rest/ending）
        const sceneButtons = document.querySelectorAll('.scene-btn');
        sceneButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                sceneButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const scene = this.dataset.scene;
                window.AbyssAudio.setScene(scene);
                log(`切换到场景: ${scene}`);
            });
        });
        
        // 音效测试
        const testButtons = document.querySelectorAll('.test-btn');
        testButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const sfx = this.dataset.sfx;
                window.AbyssAudio.sfx(sfx);
                log(`播放音效: ${sfx}`);
                
                // 按钮动画反馈
                this.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 100);
            });
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            switch(e.key) {
                case '1': window.AbyssAudio.sfx('attack'); break;
                case '2': window.AbyssAudio.sfx('hurt'); break;
                case '3': window.AbyssAudio.sfx('victory'); break;
                case '4': window.AbyssAudio.sfx('defeat'); break;
                case ' ': 
                    e.preventDefault();
                    window.AbyssAudio.sfx('coin'); 
                    break;
            }
        });
        
        log('快捷键: 1-攻击, 2-受伤, 3-胜利, 4-失败, 空格-金币');
        log('提示: 首次播放可能需要点击页面任意位置以激活音频');
    </script>
</body>
</html>
