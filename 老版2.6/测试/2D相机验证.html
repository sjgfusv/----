<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2D 相机纵向可视 · 验证台</title>
<!--
  用途：验证「相机纵向余量 + 上移上限 + 主角压在 HUD 安全线下方」这套修改。
  背景：短屏手机横屏（H≈360）时平台带在 y≈50~154，而左上 HUD 列原来下沿到 y≈157，
        相机 Y 边界又写死 0..H（scrollY 恒 0）→ 跳上台阶后人躲在 HUD 后面、且看不见地面。

  ⚠ 重要（踩过的坑）：无头浏览器用 --virtual-time-budget 时，setTimeout 会被快进，
  但 requestAnimationFrame 驱动的游戏循环未必跟着出帧 —— 表现就是「时钟冻住、相机不动」，
  会得出错误结论。所以本文件里所有剧本步骤都用 **场景时钟**（scene.time.delayedCall）
  驱动：只有真正出帧时才推进，测出来的数字才可信。

  用法：?size=800x360&auto=perch&i=0  ·  auto=ground  ·  nofix=1（复现改动前的锁死行为）
       控制台：__CAM.probe() / __CAM.platforms() / __CAM.perch(i) / __CAM.ground()
-->
<style>
  html, body { margin: 0; background: #0b0b12; color: #cfd6e6; font: 12px/1.6 Consolas, monospace; }
  #wrap { padding: 10px; }
  #host { width: 800px; height: 360px; position: relative; background: #07070f; }
  #out { white-space: pre-wrap; padding: 8px 10px; border-top: 1px solid #223; }
  .hint { color: #7f8ea8; }
</style>
</head>
<body>
<div id="wrap">
  <div id="host"></div>
  <div id="out">booting…</div>
  <div id="result"></div>
  <div class="hint">
    控制台：<code>__CAM.resize(w,h)</code> · <code>__CAM.ground()</code> ·
    <code>__CAM.perch(i)</code> · <code>__CAM.probe()</code> · <code>__CAM.platforms()</code><br />
    无人值守：<code>?size=800x360&amp;auto=perch&amp;i=0</code> · <code>auto=ground</code> · <code>nofix=1</code>
  </div>
</div>

<script src="../vendor/phaser.min.js?v=20250907p"></script>
<script src="../角色形象.js?v=20250910r2"></script>
<script src="../试炼2D.js?v=202609230"></script>
<script>
window.__CAM = (function () {
  var out = document.getElementById('out');
  var lines = [];
  function log(s) { lines.push(s); out.textContent = lines.join('\n'); }
  window.addEventListener('error', function (e) {
    log('!! 未捕获异常: ' + (e.message || e.error) + ' @line ' + (e.lineno || '?'));
  });
  function api() { return window.试炼2D || window.Trial2D; }
  function scene() {
    var g = api() && api().getGame();
    if (!g || !g.scene) return null;
    var list = (g.scene.getScenes(true) || []);
    return list[0] || (g.scene.scenes && g.scene.scenes[0]) || null;
  }
  var Q = new URLSearchParams(location.search);

  var C = {
    ready: false, scene: null, log: log,

    resize: function (w, h) {
      var host = document.getElementById('host');
      host.style.width = w + 'px'; host.style.height = h + 'px';
      var a = api(), s = scene();
      if (a && a.getGame()) {
        a.getGame().scale.resize(w, h);
        if (s && s.ready) s.onResize({ width: w, height: h });
      }
      log('resize → ' + w + '×' + h);
      return C.probe();
    },

    ground: function (x) {
      var s = scene(); if (!s) return null;
      s.hero.body.reset((x == null) ? Math.max(140, s.scale.width * 0.5) : x, s.groundY);
      return { heroY: Math.round(s.hero.y) };
    },

    platforms: function () {
      var s = scene(); if (!s) return [];
      return (s.platformPerches || []).map(function (p, i) {
        return { i: i, x: Math.round(p.x), y: Math.round(p.y), len: p.len };
      }).sort(function (a, b) { return a.y - b.y; });
    },

    perch: function (i) {
      var s = scene(); if (!s) return null;
      var ps = C.platforms();
      if (!ps.length) return { error: '本房间没有平台' };
      var p = ps[Math.min(i || 0, ps.length - 1)];
      // perch.y 比平台实际台面高 10px（引擎里它按 spot.y-20 记，而碰撞体 20 厚、顶面在 spot.y-10），
      // 所以「站上去」要落在 p.y + 10 才是真实站位，否则会把主角摆高 10px、测出偏悲观的结果。
      s.hero.body.reset(p.x, p.y + 10);
      return { placedOn: p, heroY: Math.round(s.hero.y) };
    },

    probe: function () {
      var s = scene(), a = api();
      if (!s || !s.ready) return { ready: false };
      var cam = s.cameras.main;
      var hh = s.hero.displayHeight || 52;
      var b = cam._bounds || { y: 0, height: 0 };
      var screenY = s.hero.y - cam.scrollY;
      var safeTop = s.hudSafeTop();
      var pills = [];
      (s.hudButtons || []).forEach(function (x) { if (x && x.gfx) pills.push([x.id, Math.round(x.x), Math.round(x.y), Math.round(x.w)]); });
      if (s.skillBtn && s.skillBtn.gfx) pills.push(['skill', Math.round(s.skillBtn.x), Math.round(s.skillBtn.y), Math.round(s.skillBtn.w)]);
      var ps = C.platforms();
      return {
        size: s.scale.width + '×' + s.scale.height,
        groundY: Math.round(s.groundY),
        hudSafeTop: safeTop,
        hudRowBottom: Math.round(s._hudRowBottom || 0),
        camBounds: [Math.round(b.y), Math.round(b.height)],
        scrollY: Math.round(cam.scrollY),
        heroY: Math.round(s.hero.y),
        heroScreenY: Math.round(screenY),
        heroHeadScreenY: Math.round(screenY - hh),
        groundScreenY: Math.round(s.groundY - cam.scrollY),
        // 判定：头顶在安全线下方 且 地面线留在屏幕内
        heroVisible: Math.round(screenY - hh) >= safeTop,
        groundVisible: Math.round(s.groundY - cam.scrollY) <= s.scale.height - 4,
        platformYs: ps.map(function (p) { return p.y; }),
        hudPills: pills,
        touchZone: s._touchZone ? { left: Math.round(s._touchZone.left), joyRight: Math.round(s._touchZone.joyRight) } : null,
        frames: s.__frames || 0,
        fps: a && a.getGame() && a.getGame().loop ? Math.round(a.getGame().loop.actualFps) : null
      };
    }
  };

  /** 复现改动前的行为：相机 Y 边界锁死 0..H、纵向不跟随 */
  function applyNoFix(s) {
    s.hudSafeTop = function () { return -99999; };
    s.syncCameraV = function () { s.cameras.main.scrollY = 0; };
    s.applyCameraBounds = function () {
      var H = s.scale.height;
      s._camHeadroom = 0;
      s.physics.world.setBounds(0, -600, s.levelWidth, H + 1200);
      s.cameras.main.setBounds(0, 0, s.levelWidth, H);
    };
    s.applyCameraBounds();
    s.cameras.main.scrollY = 0;
    log('※ nofix=1：已复现改动前的相机行为（scrollY 锁死 0）');
  }

  /**
   * 自动剧本：**逐帧**驱动（rAF），记录每帧真实 scrollY
   * ------------------------------------------------------------
   * 为什么必须逐帧：同步调用 syncCameraV 只能证明「这个函数算得对」，
   * 证明不了「它和 Phaser 每帧的跟随有没有互相打架」——
   * 若 startFollow 的 lerpY=0 并没有真的冻结纵向跟随，Phaser 会在 preRender 里
   * 把 scrollY 拉回跟随目标，玩家看到的就是「相机又跑高了、地面没了」。
   * 逐帧历史里如果出现超过上限（-84）的值，就是这条在打架的铁证。
   */
  function autoRun() {
    var auto = Q.get('auto');
    var s = scene();
    if (!auto || !s || !s.ready) return;
    var hist = [], n = 0, teleported = false;
    function tick() {
      n++;
      var cam = s.cameras.main;
      hist.push(Math.round(cam.scrollY));
      if (hist.length > 16) hist.shift();
      if (n === 4) { if (auto === 'ground') C.ground(); else C.perch(parseInt(Q.get('i') || '0', 10)); teleported = true; }
      // 传送后**每帧**都刷新结果：无头环境下能跑几帧就抓几帧，不必赌固定帧数
      if (teleported) {
        var p = C.probe();
        p.frames = n;
        p.scrollHistory = hist.slice();
        p.scrollMin = Math.min.apply(null, hist);
        p.scrollMax = Math.max.apply(null, hist);
        p.capExpected = -Math.max(0, (s.scale.height - s.groundY) - 12);
        document.getElementById('result').textContent = 'RESULT ' + JSON.stringify(p);
      }
      if (n < 300) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function boot() {
    var a = api();
    if (!a) { log('× 试炼2D 未加载'); return; }
    var host = document.getElementById('host');
    var size = Q.get('size');
    if (size && size.indexOf('x') > 0) {
      var wh = size.split('x');
      host.style.width = Math.max(200, parseInt(wh[0], 10) || 800) + 'px';
      host.style.height = Math.max(200, parseInt(wh[1], 10) || 360) + 'px';
    }
    var ok = a.init(host, true);
    log('init: ' + ok + (ok ? '' : ' —— ' + a.lastError()));
    if (!ok) return;
    a.startRun({
      heroName: '验证员', points: 0, difficulty: 'normal', heroId: 'warrior',
      player: { hp: 100, maxHp: 100, attack: 10, shield: 0, potions: 1,
                critRate: 0, critDamage: 150, dodge: 0, thorn: 0, vampire: 0, combo: 0, execute: 0 },
      skill: null, curses: [], environment: null
    });
    var n = 0;
    var t = setInterval(function () {
      var s = scene();
      if (s && s.ready) {
        clearInterval(t);
        C.scene = s; C.ready = true;
        window.__CAM_SCENE = s;
        // 帧计数（用场景事件，而不是包 update：Phaser 在 Systems 里缓存了 sceneUpdate 引用）
        s.__frames = 0;
        s.events.on('postupdate', function () { s.__frames++; });
        if (Q.get('nofix')) applyNoFix(s);
        log('场景就绪：' + s.scale.width + '×' + s.scale.height +
            ' · groundY=' + Math.round(s.groundY) +
            ' · hudSafeTop=' + s.hudSafeTop() +
            ' · headroom=' + (s._camHeadroom || 0) +
            ' · 平台数=' + C.platforms().length);
        autoRun();
      } else if (++n > 240) { clearInterval(t); log('× 场景 12 秒内未就绪'); }
    }, 50);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(boot, 0);
  else window.addEventListener('DOMContentLoaded', boot);
  return C;
})();
</script>
</body>
</html>
